# Render Blueprint: one file that creates the database, API and website together.
# Render dashboard → New → Blueprint → pick this repo.
databases:
  - name: memory-lane-db
    plan: free
    databaseName: memory_lane

services:
  - type: web
    name: memory-lane-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: memory-lane-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false   # paste your website's URL here after the first deploy
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: memory-lane-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # paste your API's URL here, e.g. https://memory-lane-api.onrender.com
    routes:
      - type: rewrite   # lets /dashboard etc. work on refresh
        source: /*
        destination: /index.html
